<!--
  Proposal for MH-15 Sản phẩm — reco-devops#1720 (layout) + #1721 (project cover fallback).
  Sample data is generated in this file (8 real project names, product counts as in Sales Hub);
  it does not touch store.js. Demo switches: ?hot=0|1 (no Hot / 8 Hot), ?state=loading|error.
  Filter state lives in the query string (V-01 / V-13): q, pj, type, beds, chon, avail, zone, dir, st,
  sort, view, page, channel.
-->
<style>
  /* Everything below uses DESIGN.md tokens from reco.css; prefix pv- keeps it away from the shared
     filter-sheet code in reco.js. */
  .pv-demo {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
    border: 1px dashed color-mix(in srgb, var(--orange-text) 45%, transparent);
    background: var(--notice); color: #5a3a1c;
    border-radius: var(--radius-md); padding: 8px 12px; margin-bottom: 12px;
    font-size: .8rem;
  }
  .pv-demo b { font-weight: 700; }
  .pv-demo { margin: 24px 0 0; }
  @media (min-width: 1024px) {
    .pv-demo { position: fixed; left: 16px; bottom: 16px; z-index: 60; margin: 0; max-width: calc(100vw - 32px); box-shadow: var(--shadow-float); border-style: solid; }
  }
  .pv-demo .pv-seg { display: inline-flex; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
  .pv-demo .pv-seg button {
    border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--muted);
    padding: 4px 10px; min-height: 32px; border-radius: 6px; cursor: pointer;
  }
  .pv-demo .pv-seg [aria-pressed="true"] { background: var(--navy); color: #fff; }
  .pv-demo a { color: #5a3a1c; font-weight: 600; }

  /* ---- Head: title + channel split + view switch ---- */
  .pv-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .pv-head h1 { font-size: clamp(1.4rem, 2.5vw, 1.85rem); letter-spacing: -.03em; margin: 0; }
  .pv-head .seg-channel { max-width: 340px; flex: 1 1 220px; }
  .pv-head .seg-channel [role="tab"] { min-height: 40px; }
  .pv-head-end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  @media (max-width: 767px) {
    .pv-head { flex-wrap: nowrap; }
    .pv-head h1 { white-space: nowrap; font-size: 1.35rem; }
    .pv-head .seg-channel { flex: 1 1 auto; max-width: 220px; margin-left: auto; }
    .pv-head .seg-channel .n { display: inline; }
    .pv-head-end { display: none; }
  }

  /* ---- Sticky filter bar ---- */
  .pv-bar {
    position: sticky; top: calc(var(--proto-h) + var(--header-h)); z-index: 34;
    background: var(--paper);
    margin-inline: calc(-1 * var(--gutter)); padding: 8px var(--gutter);
    border-bottom: 1px solid transparent;
    transition: border-color .16s ease, box-shadow .16s ease;
  }
  body.proto-off .pv-bar { top: var(--header-h); }
  .pv-bar.is-stuck { border-bottom-color: var(--line); box-shadow: 0 8px 18px rgb(8 39 67 / .05); }
  .pv-row1 { display: flex; gap: 8px; align-items: center; }
  .pv-search {
    flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px;
    background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 0 10px 0 12px; min-height: 44px;
  }
  .pv-search:focus-within { border-color: var(--orange-text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 18%, transparent); }
  .pv-search svg { color: var(--muted); }
  .pv-search input { border: 0; outline: 0; background: transparent; font: inherit; font-size: .92rem; width: 100%; min-width: 0; min-height: 40px; }
  .pv-search .pv-x { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 6px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .pv-search .pv-x:hover { background: var(--soft); color: var(--navy); }
  .pv-pjbtn {
    flex: 0 1 260px; min-width: 0; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--white); border-radius: var(--radius-md);
    padding: 0 12px; font: inherit; font-size: .9rem; color: var(--ink); cursor: pointer; text-align: left;
  }
  .pv-pjbtn span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-pjbtn .k { color: var(--muted); flex: none; }
  .pv-pjbtn:hover { border-color: color-mix(in srgb, var(--navy) 35%, var(--line)); }
  .pv-morebtn-phone { display: none; }
  .pv-chips { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .pv-fchip {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    min-height: 36px; padding: 0 12px; border-radius: var(--radius-pill);
    border: 1px solid var(--line); background: var(--white); color: var(--ink);
    font: inherit; font-size: .84rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .pv-fchip:hover { border-color: color-mix(in srgb, var(--navy) 40%, var(--line)); }
  .pv-fchip svg { width: 14px; height: 14px; }
  .pv-fchip[aria-pressed="true"], .pv-fchip.is-set { background: var(--navy); border-color: var(--navy); color: #fff; }
  .pv-fchip .pv-box {
    width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--muted); background: var(--white);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pv-fchip[aria-pressed="true"] .pv-box { border-color: #fff; background: #fff; color: var(--navy); }
  .pv-fchip .pv-box svg { width: 11px; height: 11px; opacity: 0; }
  .pv-fchip[aria-pressed="true"] .pv-box svg { opacity: 1; }
  .pv-fchip .pv-n { font-weight: 700; opacity: .7; font-variant-numeric: tabular-nums; }
  .pv-sep { width: 1px; height: 22px; background: var(--line); flex: none; margin-inline: 2px; }
  .pv-badge {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px;
    background: var(--orange-button); color: #fff; font-size: .68rem; font-weight: 700; line-height: 18px; text-align: center;
  }
  .pv-pjchip { display: none; }
  .pv-sortchip { display: none; }
  @media (min-width: 1280px) {
    .pv-bar { display: flex; align-items: center; gap: 8px; }
    .pv-row1 { flex: 1 1 auto; min-width: 0; }
    .pv-search { flex: 1 1 220px; }
    .pv-pjbtn { flex: 0 1 250px; }
    .pv-chips { margin-top: 0; flex-wrap: nowrap; flex: none; }
  }

  @media (max-width: 767px) {
    .pv-pjbtn { display: none; }
    .pv-morebtn-phone { display: inline-flex; }
    .pv-chips {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter);
      scroll-padding-inline: var(--gutter);
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
              mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
    }
    .pv-chips::-webkit-scrollbar { display: none; }
    .pv-pjchip, .pv-sortchip { display: inline-flex; }
    .pv-more-desk, .pv-sep { display: none !important; }
  }
  .pv-iconbtn {
    position: relative; width: 44px; height: 44px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: var(--white); border-radius: var(--radius-md);
    color: var(--navy); cursor: pointer;
  }
  .pv-iconbtn .pv-badge { position: absolute; top: -6px; right: -6px; }
  .pv-iconbtn.pv-morebtn-phone { display: none; }
  @media (max-width: 767px) { .pv-iconbtn.pv-morebtn-phone { display: inline-flex; } }
  .pv-iconbtn[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* ---- Applied filters + result line ---- */
  .pv-applied { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
  .pv-applied[hidden] { display: none; }
  .pv-ach {
    display: inline-flex; align-items: center; gap: 4px;
    min-height: 32px; padding: 0 4px 0 12px; border-radius: var(--radius-pill);
    background: var(--soft); border: 1px solid var(--line); color: var(--navy);
    font: inherit; font-size: .8rem; font-weight: 600; cursor: pointer;
  }
  .pv-ach .pv-xx { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  .pv-ach:hover .pv-xx { background: var(--white); color: var(--danger); }
  .pv-ach svg { width: 12px; height: 12px; }
  .pv-result { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 10px; flex-wrap: wrap; }
  .pv-count { font-size: .88rem; color: var(--muted); margin: 0; }
  .pv-count b { color: var(--navy); font-family: var(--font-display); font-variant-numeric: tabular-nums; }
  .pv-sort { display: inline-flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--muted); }
  .pv-sort select.inp { min-height: 36px; padding-block: 6px; width: auto; font-size: .84rem; font-weight: 600; color: var(--navy); }
  @media (max-width: 767px) {
    .pv-sort .pv-sort-k { display: none; }
    .pv-result { margin: 8px 0 8px; flex-wrap: nowrap; }
    .pv-count { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pv-sort { display: none; }
  }

  /* ---- Block A: Hot strip ---- */
  .pv-strip { margin: 4px 0 22px; }
  .pv-strip-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .pv-strip-head h2 { font-size: 1.12rem; letter-spacing: -.02em; margin: 0; white-space: nowrap; }
  .pv-strip-head .pv-strip-n { color: var(--muted); font-size: .84rem; font-weight: 600; }
  .pv-strip-head .pv-strip-end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .pv-strip-nav { display: inline-flex; gap: 6px; }
  @media (max-width: 767px) { .pv-strip-nav { display: none; } }
  .pv-strip-nav button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--white); color: var(--navy); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .pv-strip-nav button:disabled { opacity: .4; cursor: default; }
  .pv-track {
    display: grid; grid-auto-flow: column; grid-auto-columns: 62%; gap: 12px;
    overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    margin-inline: calc(-1 * var(--gutter)); padding: 2px var(--gutter) 6px; scroll-padding-inline: var(--gutter);
    list-style: none; margin-block: 0;
  }
  .pv-track::-webkit-scrollbar { display: none; }
  .pv-track > li { scroll-snap-align: start; min-width: 0; }
  @media (max-width: 767px) {
    .pv-track { grid-auto-columns: 44%; gap: 10px; }
    .pv-strip .pv-body { padding: 8px 10px 10px; }
    .pv-strip .pv-title { font-size: .86rem; }
    .pv-strip .pv-meta { font-size: .74rem; }
    .pv-strip .pv-price { display: none; }
    .pv-strip-head .pv-strip-n { display: none; }
    .pv-strip { margin-bottom: 16px; }
  }
  @media (min-width: 768px) { .pv-track { grid-auto-columns: calc((100% - 2 * 14px) / 3.3); gap: 14px; margin-inline: 0; padding-inline: 0; } }
  @media (min-width: 1280px) { .pv-track { grid-auto-columns: calc((100% - 3 * 16px) / 4.25); gap: 16px; } }

  /* ---- Cards ---- */
  .pv-grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); list-style: none; margin: 0; padding: 0; }
  @media (min-width: 1024px) { .pv-grid { gap: 14px; } }
  @media (min-width: 1280px) { .pv-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; } }
  .pv-card {
    display: flex; flex-direction: column; height: 100%; min-width: 0;
    background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-lg);
    overflow: hidden; color: inherit; text-decoration: none;
    transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
  }
  .pv-card:hover { border-color: color-mix(in srgb, var(--navy) 35%, var(--line)); box-shadow: var(--shadow-card); color: inherit; }
  .pv-card.is-hot { border-color: color-mix(in srgb, var(--orange) 55%, var(--line)); }
  .pv-media { position: relative; aspect-ratio: 16 / 10; background: var(--soft); overflow: hidden; flex: none; }
  .pv-strip .pv-media { aspect-ratio: 4 / 3; }
  @media (min-width: 768px) { .pv-strip .pv-media { aspect-ratio: 16 / 10; } }
  .pv-media img { width: 100%; height: 100%; object-fit: cover; }
  .pv-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: color-mix(in srgb, var(--muted) 70%, transparent); }
  .pv-ph svg { width: 28px; height: 28px; }
  .pv-hot {
    position: absolute; left: 8px; top: 8px; z-index: 2;
    padding: 2px 9px; border-radius: var(--radius-pill); background: var(--orange); color: #2a1200;
    font-size: .68rem; font-weight: 700; letter-spacing: .04em;
  }
  .pv-pjimg {
    position: absolute; left: 8px; bottom: 8px; z-index: 2;
    padding: 1px 7px; border-radius: 6px; background: rgb(9 38 60 / .78); color: #fff;
    font-size: .66rem; font-weight: 600; letter-spacing: .01em;
  }
  .pv-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .pv-title { font-family: var(--font-display); font-weight: 700; color: var(--navy); font-size: .96rem; letter-spacing: -.02em; line-height: 1.3; margin: 0; }
  .pv-meta { font-size: .8rem; color: var(--muted); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-meta .pv-code { font-variant-numeric: tabular-nums; color: var(--ink); }
  .pv-hit { font-size: .76rem; color: var(--orange-text); font-weight: 600; margin: 0; }
  .pv-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .pv-units { font-size: .8rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pv-price { font-size: .72rem; color: var(--muted); margin: 6px 0 0; padding-top: 6px; border-top: 1px solid var(--soft); }
  /* Unit status chip — DESIGN.md §5 (unit-status-chip.tsx) */
  .pv-st { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: var(--radius-pill); font-size: .7rem; font-weight: 700; line-height: 1.6; white-space: nowrap; border: 1px solid transparent; }
  .pv-st-available { background: var(--navy); color: #fff; }
  .pv-st-hold { background: var(--notice); color: var(--orange-text); }
  .pv-st-sold { background: var(--white); color: var(--muted); border-color: var(--line); }
  .pv-st-stopped { background: var(--soft); color: var(--muted); }

  /* Row (phone always; list view from 768) */
  .pv-rows { list-style: none; margin: 0; padding: 0; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
  .pv-rows > li + li { border-top: 1px solid var(--line); }
  .pv-row { display: flex; gap: 12px; padding: 6px 10px; color: inherit; text-decoration: none; align-items: center; min-height: 78px; }
  .pv-row:hover { background: color-mix(in srgb, var(--soft) 60%, var(--white)); color: inherit; }
  .pv-row .pv-media { width: 88px; aspect-ratio: 4 / 3; border-radius: var(--radius-sm); }
  .pv-row .pv-hot { left: 4px; top: 4px; padding: 0 6px; font-size: .6rem; }
  .pv-row .pv-pjimg { left: 4px; bottom: 4px; padding: 0 5px; font-size: .58rem; border-radius: 4px; }
  .pv-row .pv-ph svg { width: 20px; height: 20px; }
  .pv-row .pv-body { padding: 0; gap: 1px; }
  .pv-row .pv-title { font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-row .pv-foot { margin-top: 2px; }
  .pv-row .pv-price { display: none; }
  .pv-row-extra { display: none; }
  @media (min-width: 768px) {
    .pv-row { padding: 10px 14px; gap: 16px; }
    .pv-row .pv-media { width: 104px; }
    .pv-row .pv-body { flex: 1 1 auto; }
    .pv-row-extra { display: block; flex: 0 0 26%; font-size: .8rem; color: var(--muted); min-width: 0; }
    .pv-row-extra span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pv-row .pv-foot { flex: 0 0 180px; justify-content: flex-end; margin: 0; }
  }

  /* ---- Groups (no project filter) ---- */
  .pv-group { margin-bottom: 22px; }
  .pv-ghead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; min-height: 44px; }
  .pv-gthumb { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--soft); flex: none; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .pv-gthumb img { width: 100%; height: 100%; object-fit: cover; }
  .pv-gthumb svg { width: 18px; height: 18px; }
  .pv-gname { min-width: 0; flex: 1; }
  .pv-gname h2 { font-size: 1.02rem; letter-spacing: -.02em; margin: 0; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-gname p { margin: 0; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pv-gall {
    flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 6px 0 10px;
    border: 0; background: transparent; font: inherit; font-size: .84rem; font-weight: 600; color: var(--navy);
    border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
  }
  .pv-gall:hover { background: var(--soft); }
  .pv-gall svg { width: 15px; height: 15px; }
  .pv-gmore { margin-top: 8px; }

  .pv-btn-quiet { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--white); font: inherit; font-size: .84rem; font-weight: 600; color: var(--navy); cursor: pointer; }
  .pv-btn-quiet:hover { border-color: var(--navy); }

  /* Pagination — DESIGN.md §5 #1284 */
  .pv-pages { display: flex; justify-content: center; gap: 6px; margin-top: 18px; flex-wrap: wrap; }
  .pv-pages button { min-width: 36px; height: 36px; padding: 0 8px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--white); color: var(--navy); font: inherit; font-size: .84rem; font-weight: 600; cursor: pointer; }
  .pv-pages button[aria-current="page"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .pv-pages button:disabled { opacity: .4; cursor: default; }
  .pv-pages .gap { align-self: center; color: var(--muted); padding: 0 2px; }

  /* Skeleton (V-13) */
  .pv-sk-rows .skeleton { height: 78px; border-radius: 0; margin: 0; border-bottom: 1px solid var(--white); }
  .pv-sk-grid .skeleton { height: 250px; border-radius: var(--radius-lg); }

  /* ---- Popover (≥768) / bottom sheet (<768) ---- */
  .pv-layer { position: fixed; inset: 0; z-index: 80; }
  .pv-layer[hidden] { display: none; }
  .pv-scrim { position: absolute; inset: 0; background: rgb(8 22 32 / .45); animation: pvFade .18s ease-out; }
  .pv-pop {
    position: absolute; background: var(--white); border: 1px solid var(--line);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-float);
    display: flex; flex-direction: column; max-height: min(70vh, 560px);
    animation: pvDrop .16s ease-out;
  }
  .pv-pop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 8px 6px 16px; }
  .pv-pop-head h2 { font-size: 1rem; margin: 0; letter-spacing: -.02em; }
  .pv-close { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .pv-close:hover { background: var(--soft); color: var(--navy); }
  .pv-pop-body { padding: 4px 16px 12px; overflow-y: auto; }
  .pv-pop-foot { display: flex; gap: 8px; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); }
  .pv-pop-foot .btn { min-height: 44px; }
  @media (min-width: 768px) {
    .pv-layer.is-pop .pv-scrim { background: transparent; animation: none; }
  }
  @media (max-width: 767px) {
    .pv-pop {
      left: 0 !important; right: 0 !important; top: auto !important; bottom: 0; width: auto !important;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0; border-bottom: 0;
      max-height: min(82vh, calc(100dvh - 48px));
      padding-bottom: env(safe-area-inset-bottom);
      animation: pvUp .22s ease-out;
    }
    .pv-pop::before { content: ''; width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; flex: none; }
    .pv-pop-foot .btn { flex: 1; }
  }
  @keyframes pvFade { from { opacity: 0; } }
  @keyframes pvDrop { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes pvUp { from { transform: translateY(24px); opacity: .4; } }

      var keep = { zone: S.zone, dir: S.dir, st: S.st };
      S.zone = draft.zone; S.dir = draft.dir; S.st = draft.st;
      var n = PRODUCTS.filter(function (u) { return match(u); }).length;
      S.zone = keep.zone; S.dir = keep.dir; S.st = keep.st;
      return n;
    }
    function body() {
      var zones = S.pj ? PJ[S.pj].zones : [];
      var zoneHtml = S.pj
        ? '<select class="inp" id="m-zone" aria-label="Tòa hoặc Dãy"><option value="">Mọi tòa/dãy</option>' + zones.map(function (z) { return '<option' + (draft.zone === z ? ' selected' : '') + '>' + esc(z) + '</option>'; }).join('') + '</select>'
        : '<select class="inp" disabled aria-label="Tòa hoặc Dãy"><option>Chọn dự án trước</option></select><p class="pv-hint">Mỗi dự án có tòa/dãy riêng, nên chọn dự án trước.</p>';
      return '<fieldset class="pv-fieldset"><legend>Tòa / Dãy</legend>' + zoneHtml + '</fieldset>' +
        '<fieldset class="pv-fieldset"><legend>Hướng</legend><div class="pv-pillset">' + DIRS.map(function (d) {
          return '<button type="button" class="pv-fchip" data-dir="' + esc(d) + '" aria-pressed="' + (draft.dir.indexOf(d) >= 0 ? 'true' : 'false') + '">' + esc(d) + '</button>';
        }).join('') + '</div><p class="pv-hint">Chọn được nhiều hướng.</p></fieldset>' +
        '<fieldset class="pv-fieldset"><legend>Tình trạng</legend><div role="radiogroup" aria-label="Tình trạng">' + opt('', 'Mọi tình trạng', null, draft.st) +
        Object.keys(STATUS).map(function (k) { return opt(k, STATUS[k], null, draft.st); }).join('') + '</div>' +
        (S.avail ? '<p class="pv-hint">Đang bật “Còn hàng” ở thanh lọc nhanh; chọn tình trạng khác sẽ tắt nó.</p>' : '') + '</fieldset>';
    }
    function foot() { var n = draftCount(); return '<button type="button" class="btn btn-outline" id="m-reset">Bỏ chọn</button><button type="button" class="btn btn-primary" id="m-apply">Xem ' + fmt.format(n) + ' sản phẩm</button>'; }
    function bind() {
      var z = $('m-zone'); if (z) z.addEventListener('change', function () { draft.zone = z.value; refreshFoot(); });
      pop.querySelectorAll('[data-dir]').forEach(function (b) {
        b.addEventListener('click', function () {
          var d = b.getAttribute('data-dir'), i = draft.dir.indexOf(d);
          if (i >= 0) draft.dir.splice(i, 1); else draft.dir.push(d);
          b.setAttribute('aria-pressed', i >= 0 ? 'false' : 'true'); refreshFoot();
        });
      });
      pop.querySelectorAll('.pv-opt').forEach(function (b) {
        b.addEventListener('click', function () {
          draft.st = b.getAttribute('data-v');
          pop.querySelectorAll('.pv-opt').forEach(function (x) { x.setAttribute('aria-checked', x === b ? 'true' : 'false'); });
          refreshFoot();
        });
      });
      bindFoot();
    }
    function bindFoot() {
      $('m-reset').addEventListener('click', function () { draft = { zone: '', dir: [], st: '' }; $('pv-pop-body').innerHTML = body(); bind(); refreshFoot(); });
      $('m-apply').addEventListener('click', function () {
        var p = { zone: draft.zone, dir: draft.dir, st: draft.st };
        if (draft.st && draft.st !== 'available') p.avail = '';
        if (draft.st === 'available') { p.avail = '1'; p.st = ''; }
        closePanel(); set(p);
      });
    }
    function refreshFoot() { $('pv-pop-foot').innerHTML = foot(); bindFoot(); }
    openPanel(btn, 'Bộ lọc khác', body(), foot(), bind);
  }

  /* ---------------- Events ---------------- */
  var qTimer = null;
  $('f-q').addEventListener('input', function () { var v = this.value; clearTimeout(qTimer); qTimer = setTimeout(function () { set({ q: v.trim() }); }, 300); });
  $('f-q-x').addEventListener('click', function () { $('f-q').value = ''; set({ q: '' }); $('f-q').focus(); });
  $('b-pj').addEventListener('click', function () { openProject(this); });
  $('c-pj').addEventListener('click', function () { openProject(this); });
  $('c-type').addEventListener('click', function () { openType(this); });
  $('c-beds').addEventListener('click', function () { openBeds(this); });
  $('b-more').addEventListener('click', function () { openMore(this); });
  $('b-more-m').addEventListener('click', function () { openMore(this); });
  $('c-sort').addEventListener('click', function () {
    openPanel(this, 'Sắp xếp', '<div role="radiogroup" aria-label="Sắp xếp">' + SORTS.map(function (x) { return opt(x[0], x[1], null, S.sort); }).join('') +
      '</div><p class="pv-hint micro muted" style="margin:6px 10px 0">Đề xuất: sản phẩm chọn lọc trước, rồi theo dự án. Cách khác bỏ gom theo dự án.</p>', '', function () { bindRadios('sort'); });
  });
  $('c-chon').addEventListener('click', function () { set({ chon: S.chon ? '' : '1' }); });
  $('c-avail').addEventListener('click', function () { set({ avail: S.avail ? '' : '1', st: '' }); });
  $('f-sort').addEventListener('change', function () { set({ sort: this.value }); });
  $('pv-strip-all').addEventListener('click', function () { set({ chon: '1' }); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('pv-prev').addEventListener('click', function () { var t = $('pv-track'); t.scrollBy({ left: -t.clientWidth * .9, behavior: 'smooth' }); });
  $('pv-next').addEventListener('click', function () { var t = $('pv-track'); t.scrollBy({ left: t.clientWidth * .9, behavior: 'smooth' }); });
  $('pv-track').addEventListener('scroll', function () { requestAnimationFrame(updNav); }, { passive: true });
  document.querySelectorAll('.seg-channel [role="tab"]').forEach(function (t) {
    t.addEventListener('click', function () { set({ channel: t.getAttribute('data-channel') === 'cn' ? 'cn' : '', pj: '', zone: '' }); });
    t.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      var other = document.querySelector('.seg-channel [role="tab"]:not([aria-selected="true"])');
      other.click(); other.focus();
    });
  });
  document.querySelectorAll('[data-pv-view]').forEach(function (b) { b.addEventListener('click', function () { set({ view: b.getAttribute('data-pv-view') === 'list' ? 'list' : '', page: S.page }); }); });
  document.querySelectorAll('[data-demo-hot]').forEach(function (b) {
    b.addEventListener('click', function () {
      S.hot = b.getAttribute('data-demo-hot') === '1' ? '1' : '';
      applyDemoHot(S.hot === '1');
      if (window.RECO && RECO.toast) RECO.toast(S.hot ? 'Dữ liệu mẫu: 8 sản phẩm Hot' : 'Dữ liệu mẫu: chưa có sản phẩm Hot');
      paint(true);
    });
  });
  document.querySelectorAll('[data-demo-state]').forEach(function (b) { b.addEventListener('click', function () { S.state = b.getAttribute('data-demo-state'); paint(false); }); });
  document.addEventListener('click', function (e) {
    var rm = e.target.closest('[data-rm]');
    if (rm) {
      var k = rm.getAttribute('data-rm');
      if (k === 'all') clearAll(); else { var p = {}; p[k] = k === 'dir' ? [] : ''; if (k === 'pj') p.zone = ''; set(p); }
      return;
    }
    var sp = e.target.closest('[data-setpj]');
    if (sp) { set({ pj: sp.getAttribute('data-setpj') }); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    var pg = e.target.closest('[data-page]');
    if (pg && !pg.disabled) { set({ page: Number(pg.getAttribute('data-page')) }); $('pv-count').scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    var gc = e.target.closest('[data-goch]');
    if (gc) { set({ channel: gc.getAttribute('data-goch') === 'cn' ? 'cn' : '', pj: '', zone: '' }); return; }
    if (e.target.closest('[data-retry]')) { S.state = ''; paint(true); }
  });

  /* Sticky bar edge: IntersectionObserver on a sentinel, no scroll listener */
  var bar = $('pv-bar'), sentinel = document.createElement('div');
  sentinel.style.height = '1px'; bar.parentNode.insertBefore(sentinel, bar);
  new IntersectionObserver(function (es) { bar.classList.toggle('is-stuck', !es[0].isIntersecting); }, { rootMargin: '-' + (bar.getBoundingClientRect().top + 1) + 'px 0px 0px 0px' }).observe(sentinel);

  if (isPhone()) $('f-q').placeholder = 'Mã sản phẩm hoặc mã căn…';
  paint(false);
});
</script>
</body>
</html>
