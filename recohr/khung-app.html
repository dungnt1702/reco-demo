<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecoHR — Xem bản app</title>
<meta name="theme-color" content="#09263c">
<link rel="icon" href="../sales-hub/assets/img/reco-logo.png">
<link rel="stylesheet" href="assets/hr.css">
<style>
  body { padding-bottom: 0; background: linear-gradient(160deg, #e9ecea, #f8f7f3); }
  .stage { display: grid; gap: 24px; justify-items: center; padding: 24px var(--gutter) 40px; }
  @media (min-width: 900px) { .stage { grid-template-columns: 260px auto; justify-content: center; align-items: start; } }
  .picker { display: grid; gap: 6px; width: 100%; }
  .picker a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-md); text-decoration: none; color: var(--ink); font-weight: 600; font-size: 0.9rem; }
  .picker a:hover { background: var(--white); }
  .picker a[aria-current="page"] { background: var(--white); color: var(--navy); box-shadow: var(--shadow-card); }
  .phone { width: 414px; height: 868px; max-width: calc(100vw - 32px); border-radius: 48px; padding: 12px; background: #0d1820; box-shadow: 0 30px 80px rgb(8 39 67 / 0.3); position: relative; }
  .phone::before { content: ''; position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; border-radius: 16px; background: #0d1820; z-index: 2; }
  .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 37px; background: var(--paper); }
  @media (max-width: 899px) { .picker { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
  @media (max-width: 480px) { .phone { display: none; } .only-small { display: block !important; } }
</style>
</head>
<body data-shell="gallery" data-page="khung-app">
<div class="proto-note">Bản app hiển thị trong khung iPhone 390 × 844. <a href="index.html">Danh sách màn</a></div>
<main class="stage">
  <nav class="picker" id="picker" aria-label="Chọn màn">
    <a href="?p=dang-nhap" data-p="dang-nhap"><i data-i="lock"></i>Đăng nhập</a>
    <a href="?p=trang-chu" data-p="trang-chu"><i data-i="home"></i>Trang chủ</a>
    <a href="?p=cham-cong" data-p="cham-cong"><i data-i="finger"></i>Chấm công</a>
    <a href="?p=bang-cong" data-p="bang-cong"><i data-i="cal"></i>Bảng công</a>
    <a href="?p=don-tu" data-p="don-tu"><i data-i="doc"></i>Đơn từ</a>
    <a href="?p=phe-duyet" data-p="phe-duyet"><i data-i="check"></i>Phê duyệt</a>
    <a href="?p=nhan-su" data-p="nhan-su"><i data-i="users"></i>Nhân sự</a>
  </nav>
  <div class="phone"><iframe id="frame" title="Màn hình app RecoHR"></iframe></div>
  <p class="only-small micro" style="display:none">Màn hình của bạn đã đủ nhỏ — mở trực tiếp từng màn để xem bản app.</p>
</main>
<script src="assets/hr.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var ALLOWED = ['dang-nhap', 'trang-chu', 'cham-cong', 'bang-cong', 'don-tu', 'phe-duyet', 'nhan-su'];
  var frame = document.getElementById('frame');
  function load(p) {
    if (ALLOWED.indexOf(p) < 0) p = 'trang-chu';
    frame.src = p + '.html';
    document.querySelectorAll('#picker a').forEach(function (a) {
      if (a.getAttribute('data-p') === p) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  document.getElementById('picker').addEventListener('click', function (e) {
    var a = e.target.closest('a[data-p]');
    if (!a) return;
    e.preventDefault();
    history.replaceState(null, '', '?p=' + a.getAttribute('data-p'));
    load(a.getAttribute('data-p'));
  });
  /* Đồng bộ menu khi người xem bấm điều hướng bên trong khung */
  frame.addEventListener('load', function () {
    try {
      var p = frame.contentWindow.location.pathname.split('/').pop().replace('.html', '');
      if (ALLOWED.indexOf(p) >= 0) {
        history.replaceState(null, '', '?p=' + p);
        document.querySelectorAll('#picker a').forEach(function (a) {
          if (a.getAttribute('data-p') === p) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
        });
      }
    } catch (err) { /* file:// có thể chặn đọc location — bỏ qua */ }
  });
  load(new URLSearchParams(location.search).get('p'));
});
</script>
</body>
</html>
